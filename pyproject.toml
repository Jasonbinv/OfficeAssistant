[project]
name = "office-assistant"
version = "0.1.0"
description = "办公文件助手"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
